[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edtech-course-receipt-service"
version = "0.1.0"
description = "A typed FastAPI service that sends course receipts with delivery, deadline, and educator reporting details."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "email-validator>=2.2,<3",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/course_receipts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
